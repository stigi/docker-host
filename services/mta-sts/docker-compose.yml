## Serves the MTA-STS policy for the three mail domains hosted on this box.
## Fastmail's inbound hosts are matched by wildcard so the policy survives a
## region change (in1/in2 <-> eu1/eu2) without an edit.
##
## Policy lives at site/.well-known/mta-sts.txt. nginx serves .txt as
## text/plain, which the MTA-STS spec requires. Bump `mode` to `enforce`
## once the TLS-RPT reports are clean.
services:
  mta-sts:
    # PINNED 2026-11-20, tag plus digest. 1.31.9 fixes CVE-2026-123634 (resolver
    # use-after-free; this config has no proxy, SSI or mirror, so the update is a
    # precaution). History: floating nginx:alpine (1.31.6) until 2026-10-22, then
    # 1.31.8. This build (2026-11-18) ships the same Alpine ca-certificates
    # 20261020-r0, without emSign ECC Root CA - G3 / AAA (eMudhra compromise).
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - caddy
    labels:
      caddy: mta-sts.ullrich.is, mta-sts.seidbereit.de, mta-sts.clever.dev
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
