services:
  grafana:
    # PINNED. Upgraded 11.6.0 -> 13.2.2 on 2026-09-25 (two majors). The database
    # migration is ONE-WAY: 11.x cannot read the schema 13 writes. Pre-upgrade
    # volume backup: /root/grafana-volume-pre-13-20260925.tar.gz, API exports in
    # /root/grafana-pre-upgrade-20260925/.
    #
    # Not `:latest` on purpose -- alert rules, dashboards and the ntfy contact
    # point's bearer token live in the grafana_storage volume, so an accidental
    # major bump is a one-way change to state that is not in git.
    image: grafana/grafana:13.2.2
    restart: always
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini
      - 'grafana_storage:/var/lib/grafana'
    secrets:
      - GRAFANA_ADMIN_PASSWORD
    environment:
      # Grafana's file provider: GF_<SECTION>_<KEY>__FILE (double underscore).
      # Set 2026-09-24 -- the admin account was still on the default
      # admin/admin. That was not reachable from the internet (Authelia gates
      # the edge and :3000 is not published), but every container on the
      # `caddy` network could reach it directly.
      #
      # Declarative on purpose: setting it through the API leaves the change in
      # the grafana_storage volume only, so a fresh volume would come back as
      # admin/admin with nothing in the repo to say otherwise.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_ADMIN_PASSWORD
    networks:
      - caddy
      - grafana
      - prometheus
    labels:
      caddy: grafana.ullrich.is
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.import: secure *
      flame.type: application
      flame.name: Grafana
      flame.url: https://grafana.ullrich.is
      
volumes:
  grafana_storage: {}

secrets:
  GRAFANA_ADMIN_PASSWORD:
    file: ./secrets/GRAFANA_ADMIN_PASSWORD

networks:
  caddy:
    external: true
  grafana:
    external: true
  prometheus:
    external: true
