// Local overrides for unattended-upgrades, applied on top of 50unattended-upgrades.
// Files in /etc/apt/apt.conf.d/ are read in name order; later files override earlier.
// Created 2026-08-22 during 24.04 -> 26.04 upgrade.

// Include -updates (regular non-security updates).
// -proposed intentionally NOT included: it's Ubuntu's staging area
// and auto-installing from it is risky. Removed on 2026-08-22.
// Long-form origin (o=/a=) used deliberately — the short-form
// "${distro_id}:${distro_codename}-updates" triggers a parser bug
// in unattended-upgrade on 26.04 (match_whitelist_string expects k=v pairs).
Unattended-Upgrade::Origins-Pattern:: "origin=${distro_id},archive=${distro_codename}-updates";

Unattended-Upgrade::Remove-Unused-Dependencies "true";
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "05:00";
