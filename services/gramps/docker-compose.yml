services:
  grampsweb: &grampsweb
    # PINNED 2026-10-11 (v24.12.2 -> 26.10.0; newer tags drop the v prefix, Zip Slip CVE-2026-40258; redis 7.2.4 -> 7.4 for CVE-2025-49844).
    # Pre-upgrade volume tarball: ~/backups/gramps-pre-v26.10.0-2026-10-11.tgz
    # Gramps Web uses CalVer for images, so the tag is
    # v24.12.2 even though the webapi inside reports 2.7.0.
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store
    # Local build of 26.10.1 (pinned digest in Dockerfile.cafix) + upgraded
    # ca-certificates + certifi. 26.10.2 is NOT fixed (built 2026-10-20 21:42,
    # still old CA store/certifi) and adds two user-DB alembic migrations.
    # To remove: delete build/pull_policy, restore
    # image: ghcr.io/gramps-project/grampsweb:<fixed tag>@sha256:<digest>
    build:
      context: .
      dockerfile: Dockerfile.cafix
    image: gramps-grampsweb:cafix
    pull_policy: build
    restart: unless-stopped
    networks:
      - internal
      - caddy
    environment:
      GRAMPSWEB_TREE: "Gramps Web"  # will create a new tree if not exists
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      - grampsweb_redis
    volumes:
      - gramps_users:/app/users  # persist user database
      - gramps_index:/app/indexdir  # persist search index
      - gramps_thumb_cache:/app/thumbnail_cache  # persist thumbnails
      - gramps_cache:/app/cache  # persist export and report caches
      - gramps_secret:/app/secret  # persist flask secret
      - gramps_db:/root/.gramps/grampsdb  # persist Gramps database
      - gramps_media:/app/media  # persist media files
      - gramps_tmp:/tmp
    labels:
      caddy: gramps.ullrich.is
      caddy.reverse_proxy: "{{upstreams 5000}}"
      flame.type: application
      flame.name: gramps
      flame.url: https://gramps.ullrich.is

  grampsweb_celery:
    <<: *grampsweb  # YAML merge key copying the entire grampsweb service config
    networks:
      - internal
    ports: []
    labels: []
    container_name: grampsweb_celery
    depends_on:
      - grampsweb_redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  grampsweb_redis:
    # PINNED 2026-10-12: 7.4 -> 8.10.2, tag plus digest. Each RDB was test-loaded
    # into 8.10.2 first (same key counts); copies in ~/backups/redis-pre-8.
    # 2026-10-22: same tag re-pushed 2026-10-21 with Alpine ca-certificates-bundle
    # 20261020-r0 (eMudhra CA compromise); digest bumped, redis version unchanged.
    image: docker.io/library/redis:8.10.2-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a
    container_name: grampsweb_redis
    restart: unless-stopped
    volumes:
      - gramps_redit:/data
    networks:
      - internal

volumes:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:
  gramps_redit:

networks:
  caddy:
    external: true
  internal:
    internal: true
