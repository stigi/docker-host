## Serves the MTA-STS policy for the three mail domains hosted on this box.
## Fastmail's inbound hosts are matched by wildcard so the policy survives a
## region change (in1/in2 <-> eu1/eu2) without an edit.
##
## Policy lives at site/.well-known/mta-sts.txt. nginx serves .txt as
## text/plain, which the MTA-STS spec requires. Bump `mode` to `enforce`
## once the TLS-RPT reports are clean.
services:
  mta-sts:
    # PINNED 2026-10-22, tag plus digest (was the floating nginx:alpine, running
    # 1.31.6). This build (2026-10-21) ships Alpine ca-certificates 20261020-r0
    # without emSign ECC Root CA - G3 / AAA (eMudhra compromise).
    image: nginx:1.31.8-alpine@sha256:e2d97c2b8c016f12c2f1a27d095685063b2f281c4edf2babfde6001cf4fb77a8
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - caddy
    labels:
      caddy: mta-sts.ullrich.is, mta-sts.seidbereit.de, mta-sts.clever.dev
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
