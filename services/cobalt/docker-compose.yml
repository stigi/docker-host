services:
  cobalt-api:
    # PINNED 2026-09-29 to the running build.
    # Base: ghcr.io/imputnet/cobalt:11.7.1@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62
    # (same build as the previously running image; locally it was only tagged :latest).
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store
    # (Dockerfile.cafix: + Alpine ca-certificates 20261020 + NODE_OPTIONS=--use-openssl-ca).
    # To drop: restore `image:` with the fixed tag/digest and remove build/pull_policy.
    build: {context: ., dockerfile: Dockerfile.cafix}
    image: cobalt-cobalt-api:cafix
    pull_policy: build
    user: 1001:1001
    restart: unless-stopped
    secrets: [KEYS]
    environment:
      API_URL: "https://cobalt.ullrich.is"
      API_KEY_URL: "file:///run/secrets/KEYS"
      API_AUTH_REQUIRED: 1
    networks:
      - caddy
    labels:
      caddy: cobalt.ullrich.is
      caddy.reverse_proxy: "{{upstreams 9000}}"
      flame.type: application
      flame.name: cobalt
      flame.url: https://cobalt.ullrich.is

networks:
  caddy:
    external: true

secrets:
  KEYS:
    file: ./secrets/keys.json
