services:
  changedetection:
    # PINNED 2026-09-28 to the running build.
    image: ghcr.io/dgtlmoon/changedetection.io:0.52.6
    container_name: changedetection
    restart: unless-stopped
    depends_on:
      - browserless-chrome
    environment:
      - BASE_URL=https://changedetection.ullrich.is
      - PLAYWRIGHT_DRIVER_URL=ws://browserless-chrome:3000/chrome?launch={"defaultViewport":{"height":720,"width":1280},"headless":false,"stealth":true}&blockAds=true
    volumes:
      - ./volumes/data:/datastore
    networks:
      - caddy
      - internal
      - ntfy
    labels:
      caddy: changedetection.ullrich.is
      caddy.reverse_proxy: "{{upstreams 5000}}"
      caddy.import: secure *
      flame.type: application
      flame.name: changedetection
      flame.url: https://changedetection.ullrich.is

  browserless-chrome:
    # PINNED 2026-09-28. changedetection depends on this for rendering, so a
    # major here breaks a stateful service even though this one holds no data.
    # Pinned by DIGEST: the v2.38.3 tag has since been re-pushed and now resolves
    # to different bytes, so pinning to it would have swapped the image rather
    # than frozen it.
    image: ghcr.io/browserless/chrome@sha256:442068941412ca5f00cdf30213b1e46c3d3bf41983351a55821651d61a1e9bbe
    container_name: changedetection-browserless-chrome
    restart: unless-stopped
    networks:
      - internal
      - egress

networks:
  caddy:
    external: true
  internal:
    internal: true
  egress: {}
  ntfy:
    external: true
