services:
  database:
    # 2026-09-28: 16 -> 18 by dump/restore, not pg_upgrade. At 13MB the speed
    # difference is irrelevant, and a fresh cluster means the old volume
    # (cal_database-data) stays byte-for-byte intact as the rollback.
    image: postgres:18
    restart: unless-stopped
    volumes:
      # postgres:18 changed PGDATA to /var/lib/postgresql/18/docker and moved its
      # declared volume to /var/lib/postgresql. Mounting at .../data now fails
      # outright. Upstream's instruction is a single mount at /var/lib/postgresql,
      # which also keeps pg_upgrade --link working across future majors.
      # https://github.com/docker-library/postgres/pull/1259
      - database-data-18:/var/lib/postgresql
      - ./with-expanded-env.sh:/with-expanded-env.sh
    secrets: [POSTGRES_PASSWORD]
    environment:
      POSTGRES_DB: a1811e86f410ea1716d366c07cc6ed42
      POSTGRES_USER: cal_pg
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    networks:
      - internal

  calcom:
    # PINNED 2026-10-11 to v6.2.0, the last image cal.com publishes on Docker
    # Hub. Upgraded from web 4.9.6 (digest sha256:3142600b...) for
    # CVE-2026-23478 and CVE-2025-66489. Pre-upgrade dump:
    # ~/backups/cal-pre-v6.2.0-2026-10-11-1209.sql
    # Before that this was untagged (:latest) and the 2026-09-28 pin used the
    # digest, because cal.com publishes no tag for the 4.9.6 build.
    #
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store.
    # Dockerfile.cafix = calcom/cal.com:v6.2.0@sha256:ace3bb12... + Debian
    # ca-certificates 20250419~deb12u2. To drop: restore
    # `image: calcom/cal.com:<fixed tag>` and remove build/pull_policy.
    # image: calcom/cal.com:v6.2.0
    build:
      context: .
      dockerfile: Dockerfile.cafix
    image: cal-calcom:cafix
    pull_policy: build
    restart: unless-stopped
    networks:
      - internal
      - caddy
    depends_on:
      - database
    env_file: .env
    environment:
      # eMudhra CA (2026-10-22): Node 20 (EOL) trusts its own compiled-in root
      # store, which still contains "emSign ECC Root CA - G3" and will never be
      # fixed. --use-openssl-ca makes Node use the system store instead
      # (Node 20 has no --use-system-ca). Keep this as long as the image runs
      # Node < 22.23.4 / 24.22.1, even after dropping Dockerfile.cafix.
      # Verified to reach next-server through yarn/turbo's env filtering.
      NODE_OPTIONS: --use-openssl-ca
    secrets: [CALENDSO_ENCRYPTION_KEY, DATABASE_URL, EMAIL_SERVER_PASSWORD, GOOGLE_API_CREDENTIALS, NEXTAUTH_SECRET, POSTGRES_PASSWORD, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET]
    volumes:
      - ./with-expanded-env.sh:/with-expanded-env.sh
    command: ["/with-expanded-env.sh", "/calcom/scripts/start.sh"]
    labels:
      # Specific to caddy setup on ullrich.is
      caddy: cal.ullrich.is
      caddy.reverse_proxy: "{{upstreams 3000}}"
      flame.type: application
      flame.name: cal
      flame.url: https://cal.ullrich.is

secrets:
  CALENDSO_ENCRYPTION_KEY:
    file: ./secrets/CALENDSO_ENCRYPTION_KEY
  DATABASE_URL:
    file: ./secrets/DATABASE_URL
  EMAIL_SERVER_PASSWORD:
    file: ./secrets/EMAIL_SERVER_PASSWORD
  GOOGLE_API_CREDENTIALS:
    file: ./secrets/GOOGLE_API_CREDENTIALS
  NEXTAUTH_SECRET:
    file: ./secrets/NEXTAUTH_SECRET
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  ZOOM_CLIENT_ID:
    file: ./secrets/ZOOM_CLIENT_ID
  ZOOM_CLIENT_SECRET:
    file: ./secrets/ZOOM_CLIENT_SECRET

volumes:
  # kept, unused, as the pre-upgrade rollback target
  database-data:
  database-data-18:

networks:
  internal:
    external: false
  caddy:
    external: true
