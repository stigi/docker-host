# Seeded 2026-10-12 from the flame.* labels. `server`/`container` give each
# tile its live container status. Prefer homepage.* labels for new services.
- Services:
    - Mastodon:
        href: https://social.ullrich.is
        icon: mastodon.png
        server: docker
        container: mastodon-web-1
        # Public instance API, no token. Through Caddy, because Mastodon only
        # answers requests for its own host name.
        widget:
          type: mastodon
          url: https://social.ullrich.is
    - Forgejo:
        href: https://git.ullrich.is
        icon: forgejo.png
        server: docker
        container: forgejo-forgejo-1
    - Forgejo runner:
        href: https://git.ullrich.is/-/admin/actions/runners
        icon: forgejo.png
        description: CI for trails-cool, capacity 3
        server: docker
        container: trails-runner
    - Cal:
        href: https://cal.ullrich.is
        icon: cal-com.png
        server: docker
        container: cal-calcom-1
    - Audiobookshelf:
        href: https://audioshelf.ullrich.is
        icon: audiobookshelf.png
        server: docker
        container: audiobookshelf-audiobookshelf-1
    - Gramps:
        href: https://gramps.ullrich.is
        icon: gramps-web.png
        server: docker
        container: gramps-grampsweb-1
    - n8n:
        href: https://n8n.ullrich.is
        icon: n8n.png
        server: docker
        container: n8n-n8n-1
    - changedetection:
        href: https://changedetection.ullrich.is
        icon: changedetection.png
        server: docker
        container: changedetection
    - cobalt:
        href: https://cobalt.ullrich.is
        icon: cobalt.png
        server: docker
        container: cobalt-cobalt-api-1
    - Plausible:
        href: https://plausible.ullrich.is
        icon: plausible.png
        server: docker
        container: plausible-plausible-1
        # No native widget: Stats API v1, today in the site's time zone.
        widget:
          type: customapi
          url: http://plausible-plausible-1:8000/api/v1/stats/aggregate?site_id=ullrich.is&period=day&metrics=visitors,pageviews
          refreshInterval: 300000
          headers:
            Authorization: Bearer {{HOMEPAGE_FILE_PLAUSIBLE_API_KEY}}
          mappings:
            - field: results.visitors.value
              label: Visitors today
              format: number
            - field: results.pageviews.value
              label: Pageviews today
              format: number
    - ntfy:
        href: https://ntfy.ullrich.is
        icon: ntfy.png
        server: docker
        container: ntfy

- Observability:
    - Grafana:
        href: https://grafana.ullrich.is
        icon: grafana.png
        server: docker
        container: grafana-grafana-1
        # Not the native grafana widget: it needs a server admin for
        # /api/admin/stats. This counts firing, unsilenced Grafana alerts with
        # a Viewer token.
        widget:
          type: customapi
          url: http://grafana-grafana-1:3000/api/alertmanager/grafana/api/v2/alerts?active=true&silenced=false&inhibited=false
          refreshInterval: 60000
          headers:
            Authorization: Bearer {{HOMEPAGE_FILE_GRAFANA_TOKEN}}
          mappings:
            - label: Firing alerts
              format: size
    - Prometheus:
        href: https://prometheus.ullrich.is
        icon: prometheus.png
        server: docker
        container: prometheus-prometheus-1
    - cAdvisor:
        href: https://cadvisor.ullrich.is
        icon: cadvisor.png
        server: docker
        container: cadvisor
