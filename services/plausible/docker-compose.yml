services:
  # db_upgrade:
  #   image: pgautoupgrade/pgautoupgrade:16-alpine
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_PASSWORD: [redacted]
  #     PGAUTO_ONESHOT: yes

  plausible_db:
    image: postgres:16-alpine
    networks:
      - internal
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    secrets:
      - POSTGRES_PASSWORD
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  plausible_events_db:
    # 2026-09-28: 24.3.3.102 -> 24.12, the version Plausible CE v3.2.1 pins.
    # NOT the newest ClickHouse: v3.2.1's own compose specifies 24.12, and
    # running ahead of what upstream tests against buys nothing here.
    image: clickhouse/clickhouse-server:24.12-alpine
    user: 1001:1001
    networks:
      - internal
    restart: unless-stopped
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      # This makes ClickHouse bind to IPv4 only, since Docker doesn't enable IPv6 in bridge networks by default.
      # Fixes "Listen [::]:9000 failed: Address family for hostname not supported" warnings.
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      # This makes ClickHouse consume less resources, which is useful for small setups.
      # https://clickhouse.com/docs/en/operations/tips#using-less-than-16gb-of-ram
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      # Profile settings, split out of low-resources.xml. ClickHouse reads these
      # from users.d; they are ignored under config.d in the newer layout.
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
      # Allows the native BACKUP engine, so borgmatic can archive a consistent
      # copy instead of the raw running data directory. See backups.xml.
      - ./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    environment:
      # Stops the image entrypoint writing its own users.d file. Without this,
      # newer images provision a `default` user with a password while Plausible
      # still connects with none -- community-edition#232, "Code: 516 ...
      # Authentication failed: password is incorrect" after exactly this upgrade.
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  plausible:
    # 2026-09-28: v2.1.5 -> v3.2.1. The startup command is unchanged from
    # upstream's own v3.2.1 compose (createdb && migrate && run); the app runs
    # its Ecto migrations on boot.
    image: ghcr.io/plausible/community-edition:v3.2.1
    ## Plausible needs to run as 1000 which is `plausibleuser` internally, and needed to change some files on launch time
    user: 1000:1001
    networks:
      - caddy
      - internal
    restart: unless-stopped
    volumes:
      - plausible-data:/var/lib/plausible
      - ./with-expanded-env.sh:/with-expanded-env.sh
    secrets: [SMTP_PASSWORD, SECRET_KEY_BASE, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, DATABASE_URL]
    env_file:
      - plausible-conf.env
    command: ["/with-expanded-env.sh", "sh", "-c", "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"]
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    environment:
      # New in v3.2.1's compose. This service pins user: 1000:1001, so
      # /var/lib/plausible/tmp was pre-created with that ownership -- the app
      # cannot mkdir it itself inside a volume whose root is owned by root.
      - TMPDIR=/var/lib/plausible/tmp
      - DATABASE_URL={{DOCKER-SECRET:DATABASE_URL}}
      - SMTP_USER_PWD={{DOCKER-SECRET:SMTP_PASSWORD}}
      - SECRET_KEY_BASE={{DOCKER-SECRET:SECRET_KEY_BASE}}
      - GOOGLE_CLIENT_ID={{DOCKER-SECRET:GOOGLE_CLIENT_ID}}
      - GOOGLE_CLIENT_SECRET={{DOCKER-SECRET:GOOGLE_CLIENT_SECRET}}
    labels:
      caddy: plausible.ullrich.is
      caddy.reverse_proxy: "{{upstreams 8000}}"
      
      flame.type: application
      flame.name: Plausible
      flame.url: https://plausible.ullrich.is
      flame.icon: lock


volumes:
  db-data:
    driver: local
  event-data:
    driver: local
  event-logs:
    driver: local
  plausible-data:
    driver: local

networks:
  caddy:
    external: true
  internal:
    internal: true

secrets:
  SMTP_PASSWORD:
    file: ./secrets/SMTP_PASSWORD
  SECRET_KEY_BASE:
    file: ./secrets/SECRET_KEY_BASE
  GOOGLE_CLIENT_ID:
    file: ./secrets/GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET:
    file: ./secrets/GOOGLE_CLIENT_SECRET
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  DATABASE_URL:
    file: ./secrets/DATABASE_URL