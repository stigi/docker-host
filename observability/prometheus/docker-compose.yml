services:
  prometheus:
    # PINNED 2026-10-12: v2.53.4 -> v3.15.0, tag plus digest. Checked before
    # the bump: no custom flags; every target sends a valid Content-Type (v3
    # rejects scrapes without one); no le=/quantile= matchers in provisioning.
    # Rollback: the v3 TSDB is readable by v2.55+ only, so roll back to
    # v2.55.1, NOT v2.53.4.
    # 2026-10-22: v3.15.0 -> v3.15.1, a security patch release whose images
    # distrust emSign ECC Root CA - G3 / AAA (eMudhra compromise); Go 1.27.3.
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    extra_hosts:
      # Needed to scrape nftables-exporter, which runs on host network
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - internal
      - prometheus
      - caddy
    labels:
      caddy: prometheus.ullrich.is
      caddy.reverse_proxy: "{{upstreams 9090}}"
      caddy.import: secure *
      caddy_1: :2018
      caddy_1.metrics:
      flame.type: application
      flame.name: Prometheus
      flame.url: https://prometheus.ullrich.is

  node-exporter:
    # PINNED 2026-09-29 to the running build.
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave
      # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store.
      # busybox image, no package manager; v1.12.1 is the newest release. No
      # outgoing TLS expected; defence in depth. See core/ca-bundle/README.md.
      - ../../core/ca-bundle/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - internal
    command: 
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      # Lets host-side jobs publish metrics by dropping a .prom file in this
      # directory. Used by /usr/local/bin/borgmatic-metrics for backup
      # freshness: `after: error` only fires when borgmatic RUNS and fails, so
      # a stopped timer or a failed unit would otherwise be silent.
      # The path is inside the read-only /host bind above; node_exporter only
      # reads it, the host writes it.
      - '--collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
  
  # Replaced madron/iptables-exporter (2021, legacy ip_tables) with
  # cacack/nftables-exporter (reads via `nft`) during 22.04 → 24.04 upgrade.
  # Runs on host network + as root because nftables requires access to the
  # host's netfilter tables via netlink in the host network namespace.
  # Metric names changed: iptables_* → nftables_* (nftables_chain_rules,
  # nftables_rule_bytes, nftables_rule_packets, nftables_table_chains).
  nftables-exporter:
    # PINNED 2026-09-29 by DIGEST: no published tag matches the build that is
# running, so the digest is the only stable name for it.
    # eMudhra CA (2026-10-22): left as is. The image has no CA store at all
    # (no /etc/ssl/certs, no ca-certificates package) and the binary embeds
    # none, so it cannot trust any TLS server; it only reads nftables via netlink.
    image: cacack/nftables-exporter@sha256:6d657a9c2ed8d5b24053d8d791ca9d5b0ae375d9e8e6938925d919615c7079fc
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./nftables_exporter.yaml:/etc/nftables_exporter.yaml:ro

volumes:
  prometheus-data:

networks:
  caddy:
    external: true
  internal:
    internal: true
  prometheus:
    external: true
