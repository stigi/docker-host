services:
  changedetection:
    # PINNED 2026-10-12: 0.60.8 -> 0.60.9, tag plus digest.
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store
    # Local build of 0.60.9 (pinned digest in Dockerfile.cafix) + upgraded
    # ca-certificates + certifi. To remove: delete build/pull_policy, restore
    # image: ghcr.io/dgtlmoon/changedetection.io:<fixed tag>@sha256:<digest>
    build:
      context: .
      dockerfile: Dockerfile.cafix
    image: changedetection-changedetection:cafix
    pull_policy: build
    container_name: changedetection
    restart: unless-stopped
    depends_on:
      - browserless-chrome
    environment:
      - BASE_URL=https://changedetection.ullrich.is
      - PLAYWRIGHT_DRIVER_URL=ws://browserless-chrome:3000/chrome?launch={"defaultViewport":{"height":720,"width":1280},"headless":false,"stealth":true}&blockAds=true
    volumes:
      - ./volumes/data:/datastore
    networks:
      - caddy
      - internal
      - ntfy
    labels:
      caddy: changedetection.ullrich.is
      caddy.reverse_proxy: "{{upstreams 5000}}"
      caddy.import: secure *
      flame.type: application
      flame.name: changedetection
      flame.url: https://changedetection.ullrich.is

  browserless-chrome:
    # PINNED 2026-10-11: v2.38.3 (digest) -> v2.57.0, same v2 major, so the
    # /chrome ws endpoint changedetection uses is unchanged. changedetection
    # depends on this for rendering, so a major here breaks a stateful service.
    # Tag plus digest: browserless re-pushes tags (v2.38.3 was re-pushed to
    # different bytes), so the digest freezes the image.
    # 2026-10-22: v2.57.0 -> v2.57.2 (built 2026-10-21; Node 24.22.1 + Ubuntu
    # ca-certificates 20260816ubuntu0.26.04.1) for the eMudhra CA compromise.
    image: ghcr.io/browserless/chrome:v2.57.2@sha256:57eebdb0314a35065023f6339a70aad329919dea5ef6e91ab11cf24955349d6a
    container_name: changedetection-browserless-chrome
    restart: unless-stopped
    volumes:
      # STOPGAP eMudhra CA (2026-10-22): Chrome uses its own Chrome Root Store, which
      # still trusted the eMudhra chain (direct emudhra test host loaded with 200).
      # Enterprise policy CADistrustedCertificates distrusts: EM DV TLS CA - G3B (both
      # the emSign- and AAA-issued certs), emSign Root TLS CA - G3, emSign ECC Root
      # CA - G3, AAA Certificate Services. Drop when Chrome's root store/CRLSet drops them.
      - ./chrome-policies/emudhra-distrust.json:/etc/opt/chrome/policies/managed/emudhra-distrust.json:ro
    networks:
      - internal
      - egress

networks:
  caddy:
    external: true
  internal:
    internal: true
  egress: {}
  ntfy:
    external: true
