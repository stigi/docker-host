services:
  docker-socket-proxy:
    # PINNED 2026-09-29 to the running build.
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: always
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1

  flame:
    # PINNED 2026-09-29 to the running build. The app's package.json reports 0.1.0, which is not
    # the image version; the published tag for this build is 2.4.0.
    image: pawelmalak/flame:2.4.0
    container_name: flame
    volumes:
      - ./volumes:/app/data
    secrets: [PASSWORD]
    environment:
      # used for /settings endpoint
      - PASSWORD_FILE=/run/secrets/PASSWORD
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    restart: always
    networks:
      - caddy
      - internal
    labels:
      caddy: flame.ullrich.is
      caddy.reverse_proxy: "{{upstreams 5005}}"
      caddy.import: secure *

secrets:
  PASSWORD:
    file: ./secrets/PASSWORD

networks:
  caddy:
    external: true
  internal:
    internal: true
