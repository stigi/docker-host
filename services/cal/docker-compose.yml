services:
  database:
    # 2026-09-28: 16 -> 18 by dump/restore, not pg_upgrade. At 13MB the speed
    # difference is irrelevant, and a fresh cluster means the old volume
    # (cal_database-data) stays byte-for-byte intact as the rollback.
    image: postgres:18
    restart: unless-stopped
    volumes:
      # postgres:18 changed PGDATA to /var/lib/postgresql/18/docker and moved its
      # declared volume to /var/lib/postgresql. Mounting at .../data now fails
      # outright. Upstream's instruction is a single mount at /var/lib/postgresql,
      # which also keeps pg_upgrade --link working across future majors.
      # https://github.com/docker-library/postgres/pull/1259
      - database-data-18:/var/lib/postgresql
      - ./with-expanded-env.sh:/with-expanded-env.sh
    secrets: [POSTGRES_PASSWORD]
    environment:
      POSTGRES_DB: a1811e86f410ea1716d366c07cc6ed42
      POSTGRES_USER: cal_pg
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    networks:
      - internal

  calcom:
    image: calcom/cal.com
    restart: unless-stopped
    networks:
      - internal
      - caddy
    depends_on:
      - database
    env_file: .env
    secrets: [CALENDSO_ENCRYPTION_KEY, DATABASE_URL, EMAIL_SERVER_PASSWORD, GOOGLE_API_CREDENTIALS, NEXTAUTH_SECRET, POSTGRES_PASSWORD, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET]
    volumes:
      - ./with-expanded-env.sh:/with-expanded-env.sh
    command: ["/with-expanded-env.sh", "/calcom/scripts/start.sh"]
    labels:
      # Specific to caddy setup on ullrich.is
      caddy: cal.ullrich.is
      caddy.reverse_proxy: "{{upstreams 3000}}"
      flame.type: application
      flame.name: cal
      flame.url: https://cal.ullrich.is

secrets:
  CALENDSO_ENCRYPTION_KEY:
    file: ./secrets/CALENDSO_ENCRYPTION_KEY
  DATABASE_URL:
    file: ./secrets/DATABASE_URL
  EMAIL_SERVER_PASSWORD:
    file: ./secrets/EMAIL_SERVER_PASSWORD
  GOOGLE_API_CREDENTIALS:
    file: ./secrets/GOOGLE_API_CREDENTIALS
  NEXTAUTH_SECRET:
    file: ./secrets/NEXTAUTH_SECRET
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  ZOOM_CLIENT_ID:
    file: ./secrets/ZOOM_CLIENT_ID
  ZOOM_CLIENT_SECRET:
    file: ./secrets/ZOOM_CLIENT_SECRET

volumes:
  # kept, unused, as the pre-upgrade rollback target
  database-data:
  database-data-18:

networks:
  internal:
    external: false
  caddy:
    external: true
