# Release feed: diun lists each repository's tags and pushes to ntfy when a NEW
# tag appears. The docker provider separately watches the digest of the tag
# each container runs; this file is what announces new versions.
#
# Per entry: include_tags filters first, sort_tags semver orders newest first,
# max_tags keeps the top 3. So a tag only notifies if it is among the 3 newest
# -- backports to old release lines mostly stay quiet.
#
# The tag in `name` does not matter for the feed; it is the version pinned in
# the service's compose file, kept as a reminder. Floating-major images
# (forgejo:16, postgres:18, ...) watch for the next major only; patches within
# the major arrive as a digest change through the docker provider.
#
# Not watched: searxng (daily releases), clickhouse (plausible decides the
# version), n8n sandbox images (follow n8n), digest-only exporters.

# --- core
- {name: "caddy:2.11.7", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^\d+\.\d+\.\d+$']}
- {name: "authelia/authelia:4.39.28", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^\d+\.\d+\.\d+$']}
- {name: "binwiederhier/ntfy:v2.29.0", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^v\d+\.\d+\.\d+$']}
- {name: "tecnativa/docker-socket-proxy:v0.5.0", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^v\d+\.\d+\.\d+$']}

# --- services
