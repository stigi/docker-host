# Dashboard at home.ullrich.is, replacing flame (2026-10-12).
#
# Homepage has no login of its own; Authelia guards it through the `secure`
# snippet, like flame. Services come from two places:
# - config/services.yaml: seeded from flame's labels, so nothing had to restart.
# - homepage.* labels on any container (homepage.group, .name, .icon, .href,
#   .description). Add them as services get touched; labels only take effect
#   when a container is recreated.
services:
  docker-socket-proxy:
    # PINNED 2026-10-12, same build as the other socket proxies.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Container list/inspect/stats: enough for label discovery and status.
      CONTAINERS: 1

  homepage:
    # PINNED 2026-10-12, tag plus digest.
    image: ghcr.io/gethomepage/homepage:v2.5.0@sha256:57c4a0531937889c0b968b120fe9c2560bbe036b5c9e18c49a9e2479de9975d1
    container_name: homepage
    restart: unless-stopped
    environment:
      # Required since v1: requests for any other Host are rejected.
      HOMEPAGE_ALLOWED_HOSTS: home.ullrich.is
      PUID: 1001
      PGID: 1001
      # Logs to stdout (and so to Loki), not into the read-only config dir.
      LOG_TARGETS: stdout
      # Widget credentials. Homepage replaces {{HOMEPAGE_FILE_X}} in the config
      # with the content of the file at $HOMEPAGE_FILE_X. The widget proxy runs
      # server-side, so the tokens never reach the browser.
      HOMEPAGE_FILE_FORGEJO_TOKEN: /run/secrets/FORGEJO_TOKEN
      HOMEPAGE_FILE_GRAFANA_TOKEN: /run/secrets/GRAFANA_TOKEN
      HOMEPAGE_FILE_PLAUSIBLE_API_KEY: /run/secrets/PLAUSIBLE_API_KEY
    secrets:
      - FORGEJO_TOKEN
      - GRAFANA_TOKEN
      - PLAUSIBLE_API_KEY
    volumes:
      # Read-only: every skeleton file exists, so Homepage has nothing to copy.
      - ./config:/app/config:ro
    networks:
      - caddy
      - internal
    labels:
      caddy: home.ullrich.is
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.import: secure *

networks:
  caddy:
    external: true
  internal:
    internal: true
secrets:
  # Forgejo token `homepage` of user ullrich (2026-10-12), read-only scopes:
  # notification, repository, issue, admin (admin for the runner list).
  FORGEJO_TOKEN:
    file: ./secrets/FORGEJO_TOKEN
  # Grafana service account `homepage`, role Viewer (2026-10-12).
  GRAFANA_TOKEN:
    file: ./secrets/GRAFANA_TOKEN
  # Plausible API key `homepage`, scope stats:read:* (2026-10-12).
  PLAUSIBLE_API_KEY:
    file: ./secrets/PLAUSIBLE_API_KEY
