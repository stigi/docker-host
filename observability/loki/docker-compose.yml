services:
  loki:
    # PINNED. Loki and promtail must move together, and `:latest` is now 3.7.x
    # against the 3.1.2 running here. The retention config added 2026-09-24
    # (compactor + delete_request_store) is version-sensitive, so upgrade
    # deliberately and re-verify retention afterwards.
    image: grafana/loki:3.1.2
    restart: always
    networks:
      - internal
      - grafana
      - caddy
    ports:
      - 3100:3100
    volumes:
      - ./loki-config.yaml:/etc/loki-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki-config.yaml
    logging:
      options:
        mode: non-blocking

  promtail:
    # PINNED to match loki above. This container was running an UNTAGGED 23-month
    # -old digest while its compose said `:latest`; a `docker compose pull` on
    # 2026-09-25 cached a far newer image, so `up -d` would have jumped it ~2
    # years in one step.
    image: grafana/promtail:3.1.2
    restart: unless-stopped
    # promtail's docker client defaults to API 1.24 and does not negotiate
    # through the proxy; Docker 29.x refuses anything below 1.40.
    environment:
      DOCKER_API_VERSION: '1.44'
    networks:
      - internal
    volumes:
      - /var/log:/var/log
      - ./promtail-config.yaml:/etc/promtail-config.yaml
    command: -config.file=/etc/promtail-config.yaml

  # Promtail needs container metadata (names, labels) to tag log streams, which
  # means the Docker API. Same pattern as caddy, cadvisor, flame and diun on this
  # host: a read-only proxy exposing only the endpoints needed, never the raw
  # socket. CONTAINERS covers list/inspect and /containers/{id}/logs; EVENTS lets
  # promtail notice containers starting and stopping without polling hard.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      # NETWORKS is required, not optional: promtail's docker discovery computes
      # network labels for every target, which hits /networks. Without it the proxy
      # returns 403 and discovery fails wholesale -- containers list fine, then no
      # targets are produced at all.
      NETWORKS: 1
      VERSION: 1
      PING: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

networks:
  internal:
    internal: true
  grafana:
    external: true
  caddy:
    external: true

volumes:
  loki_data:
