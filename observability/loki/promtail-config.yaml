server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: fail2ban
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/fail2ban.log
          instance: zebra
          app: fail2ban
    pipeline_stages:
      - multiline:
          firstline: '\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
      - regex:
          expression: >-
            ^(?s)(?P<time>\S+? \S+?)
            (fail2ban\.)(?P<component>\S+)\s*
            \[(?P<pid>\S+)\]:
            (?P<priority>\S+)\s*
            (?P<message>.*?)$
      - timestamp:
          source: time
          format: "2006-01-02 15:04:05,000"
      - labels:
          component:
          priority:
      - output:
          source: message
      # Extract jail from message, if present
      - match:
          # Note: backticks do not work in promtail, so weird escaping is needed
          selector: '{job="fail2ban"} |~ "\\\\[\\\\S+\\\\] .*"'
          stages:
            - regex:
                expression: '(\[(?P<jail>\S+)\] )?(?P<message>.*?)$'
            - labels:
                jail:
            - output:
                source: message
      - labeldrop:
          - filename


  - job_name: ufw
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/ufw.log
          instance: zebra
          app: ufw
    pipeline_stages:
      - regex:
          expression: '^(?s)(?P<time>\S+? \S+? \S+?) (?P<hostname>\S+?) kernel: \[(?P<kerneltime>.*?)\] \[(?P<ufwaction>.*?)\] (?P<message>.*?)$'
      - timestamp:
          source: time
          format: "2006-01-02 15:04:05,000"
      - labels:
          hostname:
          ufwaction:
      - output:
          source: message
      - labeldrop:
          - filename

  # Container logs. Until 2026-09-30 these bypassed promtail entirely: the Loki
  # Docker plugin shipped them straight from dockerd. That plugin was removed
  # because it made `live-restore` unsafe (48 of 52 containers used it, and a
  # plugin log driver is the weak spot when restoring containers across a daemon
  # restart), because `mode: non-blocking` silently DROPPED logs whenever Loki
  # was unreachable, and because upgrading the plugin required stopping every
  # container using it.
  #
  # Now containers write json-file locally (rotated 10m x 3 via daemon.json) and
  # promtail reads them through the Docker API. Logs therefore survive Loki being
  # down -- they sit on disk and promtail catches up -- which the plugin could
  # not do.
  #
  # Service discovery rather than a file glob on /var/lib/docker/containers: the
  # files are named by container ID, so a glob would label everything with a hex
  # string. The API gives real container names and compose labels.
  - job_name: containers
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - target_label: 'instance'
        replacement: 'zebra'
