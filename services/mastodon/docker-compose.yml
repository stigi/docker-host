# https://github.com/mastodon/mastodon/blob/main/docker-compose.yml

services:
  web:
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    user: 991:1001
    restart: unless-stopped
    env_file: .env
    secrets: [SECRET_KEY_BASE, OTP_SECRET, VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY, DB_PASS, REDIS_PASSWORD, SMTP_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, OTEL_EXPORTER_OTLP_HEADERS]
    networks:
      - caddy
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', 'wget -q --spider --proxy=off localhost:3000/health || exit 1']
    # ports:
    #   - '127.0.0.1:3000:3000'
    depends_on:
      - db
      - redis
    volumes:
      - ./volumes/system:/mastodon/public/system
      - ./with-expanded-env.sh:/with-expanded-env.sh
    command: "/with-expanded-env.sh bundle exec puma -C config/puma.rb"
    labels:
      caddy: social.ullrich.is
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy.route: /s3/*
      # `0_uri` order matters, this must come first
      caddy.route.0_uri: strip_prefix /s3
      caddy.route.s3proxy.bucket: "ullrich-is-mastodon"
      caddy.route.s3proxy.region: "eu-central-1"
      flame.type: application
      flame.name: mastodon
      flame.url: https://social.ullrich.is

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.4@sha256:b896be8bc93db513695c3ebac8442c09453065ab1be06dfc49fe3c16a91c825c
    user: 991:1001
    restart: unless-stopped
    env_file: .env
    secrets: [SECRET_KEY_BASE, OTP_SECRET, VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY, DB_PASS, REDIS_PASSWORD, SMTP_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, OTEL_EXPORTER_OTLP_HEADERS]
    volumes:
      - ./with-expanded-env.sh:/with-expanded-env.sh
    command: "/with-expanded-env.sh node ./streaming"
    networks:
      - caddy
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', 'wget -q --spider --proxy=off localhost:4000/api/v1/streaming/health || exit 1']
    # ports:
    #   - '127.0.0.1:4000:4000'
    depends_on:
      - db
      - redis
    labels:
      caddy: social.ullrich.is
      caddy.handle: /api/v1/streaming*
      caddy.handle.reverse_proxy: "{{upstreams 4000}}"

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
    user: 991:1001
    restart: unless-stopped
    env_file: .env
    secrets: [SECRET_KEY_BASE, OTP_SECRET, VAPID_PRIVATE_KEY, VAPID_PUBLIC_KEY, DB_PASS, REDIS_PASSWORD, SMTP_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, OTEL_EXPORTER_OTLP_HEADERS]
    volumes:
      - ./volumes/system:/mastodon/public/system
      - ./with-expanded-env.sh:/with-expanded-env.sh
    command: "/with-expanded-env.sh bundle exec sidekiq"
    networks:
      - caddy
      - internal_network
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq' || false"]
    depends_on:
      - db
      - redis

# Internal DBs
  pgadmin:
    # PINNED 2026-09-28 to the running build.
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store
    # (no dpage/pgadmin4 build after 2026-10-20 yet). Dockerfile.cafix = 9.11
    # (digest-pinned) + Alpine ca-certificates 20261020 + certifi in /venv.
    # To remove: delete build/pull_policy, set image back to
    # dpage/pgadmin4:<fixed tag>@sha256:<digest>, delete Dockerfile.cafix.
    build:
      context: .
      dockerfile: Dockerfile.cafix
    image: mastodon-pgadmin:cafix
    pull_policy: build
    restart: unless-stopped
    environment:
      # Authenticated via Caddy
      # https://www.pgadmin.org/docs/pgadmin4/development/webserver.html
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['webserver']"
      PGADMIN_CONFIG_WEBSERVER_AUTO_CREATE_USER: 'True'
      PGADMIN_CONFIG_WEBSERVER_REMOTE_USER: "'HTTP_X_FORWARDED_USER'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_DEFAULT_EMAIL: 'disabled@ullrich.is'
      PGADMIN_DEFAULT_PASSWORD: 'secret'
      PGADMIN_DISABLE_POSTFIX: 'True'
      PGADMIN_CONFIG_SHOW_GRAVATAR_IMAGE: 'False'
    volumes:
      - ./volumes/pgadmin:/var/lib/pgadmin
    networks:
      - internal_network
      - caddy
    labels:
      caddy: social.ullrich.is
      caddy.redir: /pga /pga/
      caddy.route: /pga/*
      caddy.route.0_forward_auth: https://auth.ullrich.is
      caddy.route.0_forward_auth.copy_headers: Remote-Email>X-Forwarded-User
      caddy.route.0_forward_auth.header_up: Host {upstream_hostport}
      caddy.route.0_forward_auth.uri: /api/verify?rd=https://auth.ullrich.is
      caddy.route.1_uri: strip_prefix /pga
      caddy.route.2_reverse_proxy: "{{upstreams 80}}"
      caddy.route.2_reverse_proxy.header_up: +X-Script-Name /pga

  db:
    restart: unless-stopped
    # 2026-09-28: 14 -> 18 by dump/restore (4 majors). The old data dir
    # ./volumes/postgresql is left intact as the rollback.
    # 2026-10-22 eMudhra CA: pinned to the 2026-10-21 rebuild (ca-certificates
    # 20261020-r0). Same 18.6 / Alpine 3.24 as the previously running image.
    image: postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
    shm_size: 256mb
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      # postgres:18 sets PGDATA=/var/lib/postgresql/18/docker and declares its
      # volume at /var/lib/postgresql. Mounting the old .../data path makes 18
      # refuse to start outright. https://github.com/docker-library/postgres/pull/1259
      - ./volumes/postgresql-18:/var/lib/postgresql
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all


  redis:
    restart: unless-stopped
    # PINNED 2026-10-12: 7.4 -> 8.10.2, tag plus digest. Each RDB was test-loaded
    # into 8.10.2 first (same key counts); copies in ~/backups/redis-pre-8.
    # 2026-10-22 eMudhra CA: re-pinned to the 2026-10-21 rebuild of the same tag
    # (ca-certificates 20261020-r0). Was @sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    image: redis:8.10.2-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - ./volumes/redis:/data

networks:
  caddy:
    external: true
  internal_network:
    internal: true

secrets:
  SECRET_KEY_BASE:
    file: ./secrets/SECRET_KEY_BASE
  OTP_SECRET:
    file: ./secrets/OTP_SECRET
  VAPID_PRIVATE_KEY:
    file: ./secrets/VAPID_PRIVATE_KEY
  VAPID_PUBLIC_KEY:
    file: ./secrets/VAPID_PUBLIC_KEY
  DB_PASS:
    file: ./secrets/DB_PASS
  REDIS_PASSWORD:
    file: ./secrets/REDIS_PASSWORD
  SMTP_PASSWORD:
    file: ./secrets/SMTP_PASSWORD
  AWS_ACCESS_KEY_ID:
    file: ./secrets/AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY:
    file: ./secrets/AWS_SECRET_ACCESS_KEY
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:
    file: ./secrets/ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:
    file: ./secrets/ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:
    file: ./secrets/ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
  OTEL_EXPORTER_OTLP_HEADERS:
    file: ./secrets/OTEL_EXPORTER_OTLP_HEADERS