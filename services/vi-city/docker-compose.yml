## Vi City: a single-file browser game (top-down crime sandbox with vi keys).
## The whole game is site/index.html; there is no build step and no backend.
## Same static-site pattern as services/mta-sts.
services:
  vi-city:
    # Same pinned nginx build as services/mta-sts (PINNED 2026-11-20, 1.31.9,
    # fixes CVE-2026-123634).
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - caddy
    labels:
      caddy: vi-city.ullrich.is
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  caddy:
    external: true
