# Grafana alert rules for RAID / disk / inode monitoring on zebra.ullrich.is.
#
# Added 2026-09-16 after the 16-day silent md1 degradation.
#
# STATUS: exported from the live Grafana, NOT currently authoritative.
# These rules were created via the Grafana API and live in the grafana_storage
# volume. This file is the version-controlled copy.
#
# To make it authoritative, add to grafana/docker-compose.yml:
#     - ./provisioning/alerting:/etc/grafana/provisioning/alerting
# and recreate the container. Mount ONLY the alerting subdir -- mounting the
# whole provisioning/ dir would shadow Grafana's built-in datasources,
# dashboards and plugins subdirectories.
#
# The ntfy contact point is deliberately NOT in this file: it holds a bearer
# token. It lives in Grafana's database instead. On a fresh volume these rules
# would load but reference a missing "ntfy" contact point until it is recreated.
#
# Thresholds: RootFilesystemSpaceLow 15% free, RootFilesystemInodesLow 20% free.
# Originally 7% / 5% -- set just below the values at the time (9.7% / 6.6%) so
# the channel stayed quiet during the cleanup. Raised 2026-09-24 once that work
# finished: root is now 94% free on bytes and 96.3% on inodes, and thresholds
# that low would only have fired once the incident was already unavoidable.
#
# 2026-09-25: summaries now use $values.B.Value rather than $value. In Grafana
# unified alerting $value is a STRING ("[ var='B' labels={} value=100.03 ]"),
# so `$value | printf "%.1f"` rendered the literal `%!f(string=[)` in the
# delivered notification. These rules had never fired, so it went unnoticed
# until the backup-staleness alert was tested end to end.
apiVersion: 1
groups:
    - orgId: 1
      name: raid-and-disk
      folder: Infrastructure
      interval: 1m
      rules:
        - uid: ffyfzxdltupz4e
          title: MdArrayDegraded
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ae8y28lw4y1hce
              model:
                datasource:
                    type: prometheus
                    uid: ae8y28lw4y1hce
                editorMode: code
                expr: node_md_disks_required - ignoring(state) node_md_disks{state="active"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            summary: 'RAID array {{ $labels.device }} is DEGRADED: {{ $values.B.Value | printf "%.0f" }} disk(s) missing. Check /proc/mdstat immediately.'
          labels:
            severity: critical
          isPaused: false
        - uid: efyfzxdyntxxcf
          title: MdArrayFailedDisk
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ae8y28lw4y1hce
              model:
                datasource:
                    type: prometheus
                    uid: ae8y28lw4y1hce
                editorMode: code
                expr: node_md_disks{state="failed"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 2m
          annotations:
            summary: RAID array {{ $labels.device }} reports {{ $values.B.Value | printf "%.0f" }} FAILED disk(s).
          labels:
            severity: critical
          isPaused: false
        - uid: cfyfzxf189i4gd
          title: RootFilesystemInodesLow
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ae8y28lw4y1hce
              model:
                datasource:
                    type: prometheus
                    uid: ae8y28lw4y1hce
                editorMode: code
                expr: 100 * node_filesystem_files_free{mountpoint="/"} / node_filesystem_files{mountpoint="/"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: lt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            summary: Root filesystem free INODES at {{ $values.B.Value | printf "%.1f" }}% (threshold 20%). Inode exhaustion causes ENOSPC even with free bytes.
          labels:
            severity: critical
          isPaused: false
        - uid: afyfzxfa8wb28c
          title: RootFilesystemSpaceLow
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ae8y28lw4y1hce
              model:
                datasource:
                    type: prometheus
                    uid: ae8y28lw4y1hce
                editorMode: code
                expr: 100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 15
                        type: lt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 15m
          annotations:
            summary: Root filesystem free space is {{ $values.B.Value | printf "%.1f" }}% (threshold 15%).
          labels:
            severity: warning
          isPaused: false
        - uid: efyfzxe6airy8d
          title: MdArrayNotActive
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ae8y28lw4y1hce
              model:
                datasource:
                    type: prometheus
                    uid: ae8y28lw4y1hce
                editorMode: code
                expr: node_md_state{state="active"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: RAID array {{ $labels.device }} is not in the active state.
          labels:
            severity: critical
          isPaused: false
        - uid: ffyfzxedppwxsb
          title: NodeExporterDown
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: ae8y28lw4y1hce
              model:
                datasource:
                    type: prometheus
                    uid: ae8y28lw4y1hce
                editorMode: code
                expr: up{job="node-exporter"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                settings:
                    mode: dropNN
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: node-exporter is down. All RAID, disk and inode alerts are blind while this is true.
          labels:
            severity: critical
          isPaused: false
