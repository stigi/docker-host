[log]
level = warn

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Admin

[auth.proxy]
enabled = true
header_name = Remote-Email
header_property = username
auto_sign_up = true
; Only Caddy may assert Remote-Email. Without this, ANY host that can reach
; :3000 becomes an Admin by setting one header -- auto_sign_up = true plus
; auto_assign_org_role = Admin (see [users]) mean no password is involved. That
; was 23 containers on the `caddy` network, so compromising any one of them
; escalated straight to Grafana admin: read every metric and log, silence the
; alerting, and query through the Sentry/GitHub datasources without ever
; reading their tokens.
;
; Never reachable from the internet either way -- Authelia 302s everything at
; the edge -- so this is defence in depth, not a front door.
;
; CAVEAT: 172.31.0.4 is Docker's dynamic assignment for caddy-caddy-1 on the
; `caddy` network. If that container is recreated it may get a different IP and
; header auth will silently stop working -- users would get the normal Grafana
; login instead of SSO. The durable fix is to pin Caddy's IP via ipam in its
; compose and whitelist that. Added 2026-09-24.
whitelist = 172.31.0.4
