services:
  docker-socket-proxy:
    # PINNED 2026-09-29 to the running build.
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      IMAGES: 1

  cadvisor:
    # PINNED 2026-10-12: gcr.io/cadvisor stopped at v0.55.1; releases moved to
    # ghcr.io/google. Tag plus digest.
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: cadvisor
    restart: unless-stopped
    command:
      - --docker=tcp://docker-socket-proxy:2375
      - --docker_only=true
    networks:
      - caddy
      - prometheus
      - internal
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    labels:
      caddy: cadvisor.ullrich.is
      caddy.reverse_proxy: "{{upstreams 8080}}"
      caddy.import: secure *
      flame.type: application
      flame.name: cadvisor
      flame.url: https://cadvisor.ullrich.is

networks:
  caddy:
    external: true
  prometheus:
    external: true
  internal:
    internal: true
