# Local customizations for zebra.ullrich.is
# Overrides main /etc/ssh/sshd_config (snippets take precedence).
# Created 2026-08-22 during 24.04 -> 26.04 upgrade so future upgrades
# stop prompting on /etc/ssh/sshd_config.

Port 2232

# Recommendations from https://www.ssh-audit.com
HostKey /etc/ssh/ssh_host_ed25519_key
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256
MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
PerSourceMaxStartups 1

MaxAuthTries 3
IgnoreRhosts yes
PermitEmptyPasswords no
KbdInteractiveAuthentication no
X11Forwarding no

Banner /etc/issue.net
AcceptEnv LANG LC_* COLORTERM NO_COLOR
