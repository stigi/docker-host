<script>
(() => {
'use strict';
// ───────────────────────── helpers

const R = Math.random;

  yellow: '#fabd2f', blue: '#83a598', purple: '#d3869b', aqua: '#8ec07c', orange: '#fe8019',

// ───────────────────────── city

const buildings = [], trees = [], markers = [], lotSlots = [], blocks = [];

}

  const x0 = RX[i] + 3, x1 = RX[i + 1] - 2, y0 = RY[j] + 3, y1 = RY[j + 1] - 2, w = x1 - x0 + 1, h = y1 - y0 + 1;

{

}

  taxi: { l: 38, w: 18, max: 245, acc: 160, turn: 2.7, hp: 100, col: '#d79921' },
  sport: { l: 38, w: 18, max: 335, acc: 250, turn: 3.1, hp: 80 },
  truck: { l: 46, w: 21, max: 175, acc: 95, turn: 2.1, hp: 200 },

const CCOL = ['#cc241d', '#458588', '#b16286', '#689d6a', '#a89984', '#d65d0e', '#3c6e71', '#7c6f64', '#98971a', '#bdae93'];
const PCOL = ['#458588', '#b16286', '#689d6a', '#d79921', '#a89984', '#cc241d', '#7c6f64', '#d65d0e', '#bdae93', '#3c6e71'];

const cam = { x: 0, y: 0 }; let zoom = 1.5, W = 0, H = 0, DPR = 1;

function mkCar(type, x, y, a, ai) {

}

}

  for (const s of lotSlots) cars.push(mkCar(s.type, s.x, s.y, s.a));
