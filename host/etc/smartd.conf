# smartd configuration for zebra.ullrich.is
#
# Written 2026-09-16, after /dev/sda was replaced following a 16-day
# silent degradation. Alerting goes to BOTH channels, like mdadm:
#   10mail -> bsd-mailx -> msmtp -> Fastmail -> hi@ullrich.is
#   20ntfy -> /usr/local/bin/smartd-notify -> ntfy.ullrich.is/zebra
#
# Explicit device lines, not DEVICESCAN: `smartctl --scan` reports both
# disks as `-d scsi` (generic fallback), which hobbles attribute
# monitoring. `-d sat` is verified working on both.
#
# Attribute selection: deliberately NOT `-a`. `-a` implies `-t`, which
# reports every attribute change; on these Seagates ID 1, 7 and 195 swing
# constantly and would push most days. An alert channel you learn to
# ignore is the failure we are fixing. What remains still catches health
# status, threshold failures, pending/uncorrectable sectors, new error-log
# entries and failed self-tests.
#
# Schedule avoids borgmatic.timer (daily + RandomizedDelaySec=3h, so
# 00:00-03:00, ~15 min). Short tests 04:00 daily (~1 min). Long tests
# 05:00 -- sda Saturday, sdb Sunday, never both the same night.
# Both drives idle at 50 C, hence -W 0,55,60 rather than 50/55.

# /dev/sda -- ST4000NM0024 Enterprise Capacity, S/N Z4F0F7EH
# Installed 2026-09-16 as the replacement. ~8.9k power-on hours.
/dev/sda -d sat -H -f -p -I 1 -I 3 -I 7 -I 195 -C 197 -U 198 \
  -l error -l selftest -W 0,55,60 -o on -S on \
  -s (S/../.././04|L/../../6/05) \
  -m root -M exec /usr/share/smartmontools/smartd-runner

# /dev/sdb -- ST33000651AS Barracuda XT, S/N Z290R3JV
# The surviving original: 2011-era desktop drive, ~48.6k power-on hours.
# Statistically the next to fail. Watch this one.
/dev/sdb -d sat -H -f -p -I 1 -I 3 -I 7 -I 195 -C 197 -U 198 \
  -l error -l selftest -W 0,55,60 -o on -S on \
  -s (S/../.././04|L/../../7/05) \
  -m root -M exec /usr/share/smartmontools/smartd-runner
