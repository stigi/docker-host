services:
  loki:
    # PINNED 2026-10-12: 3.1.2 -> 3.7.8. Tag plus digest. The 3.2-3.7 upgrade
    # notes touch nothing configured here (blooms, S3 SDK, Helm). The retention
    # config added 2026-09-24 (compactor + delete_request_store) is
    # version-sensitive: re-verify retention after any bump. Since 3.5.8 the
    # image has no shell, so `docker exec loki sh` fails; use port 3100.
    # 2026-10-22: 3.7.8 -> 3.7.9 (built 2026-10-20 21:46, ships a CA store without
    # emSign ECC Root CA - G3 / AAA Certificate Services; eMudhra compromise).
    # Patch release: dep bumps, Go 1.26.10, WAL append fix; no config changes.
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: always
    networks:
      - internal
      - grafana
      - caddy
    ports:
      - 3100:3100
    volumes:
      - ./loki-config.yaml:/etc/loki-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki-config.yaml
    logging:
      options:
        mode: non-blocking

  alloy:
    # Replaces promtail, which Grafana has moved into maintenance in favour of
    # Alloy. config.alloy was produced by `alloy convert --source-format=promtail`
    # from the previous promtail-config.yaml rather than hand-written.
    # image: grafana/alloy:v1.20.1
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store.
    # Dockerfile.alloy-cafix = v1.20.1 by digest + Ubuntu ca-certificates
    # 20260816ubuntu0.24.04.1. Fixed upstream in v1.21.1 (see the Dockerfile for
    # the 1.21 breaking changes, none of which config.alloy uses).
    build: {context: ., dockerfile: Dockerfile.alloy-cafix}
    image: loki-alloy:cafix
    pull_policy: build
    restart: unless-stopped
    networks:
      - internal
    environment:
      # Same reason promtail needed it: the docker client defaults to API 1.24
      # and does not negotiate through the socket proxy; Docker 29.x refuses
      # anything below 1.40.
      DOCKER_API_VERSION: '1.44'
    volumes:
      - /var/log:/var/log:ro
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # alloy's position store, seeded once from promtail's /tmp/positions.yaml
      # so the switch did not re-ingest ~119MB of host logs as duplicates
      # (kern.log 36M, ufw.log 35M). config.alloy reads it via
      # legacy_positions_file.
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

  # Promtail needs container metadata (names, labels) to tag log streams, which
  # means the Docker API. Same pattern as caddy, cadvisor, flame and diun on this
  # host: a read-only proxy exposing only the endpoints needed, never the raw
  # socket. CONTAINERS covers list/inspect and /containers/{id}/logs; EVENTS lets
  # promtail notice containers starting and stopping without polling hard.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    # No outgoing TLS (HAProxy in front of the docker socket, internal network
    # only); the CA mount is defence in depth, same as the other socket proxies.
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      # NETWORKS is required, not optional: promtail's docker discovery computes
      # network labels for every target, which hits /networks. Without it the proxy
      # returns 403 and discovery fails wholesale -- containers list fine, then no
      # targets are produced at all.
      NETWORKS: 1
      VERSION: 1
      PING: 1
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store.
      # Patched shared bundle (Alpine 20261020-r0); see core/ca-bundle/README.md.
      - ../../core/ca-bundle/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # /etc/ssl/certs also holds hash links (14bc7599.0 -> mozilla/emSign_ECC_Root_CA_-_G3.crt)
      # that Go/OpenSSL CApath readers would still load; blank the source file.
      - /dev/null:/usr/share/ca-certificates/mozilla/emSign_ECC_Root_CA_-_G3.crt:ro
    networks:
      - internal

networks:
  internal:
    internal: true
  grafana:
    external: true
  caddy:
    external: true

volumes:
  alloy_data:
  loki_data:
