services:
  n8n:
    # PINNED. This was untagged, i.e. :latest, while the running version is
    # 1.73.1 and latest is 2.41.x -- a `docker compose pull` here would have
    # jumped two majors and run an irreversible database migration on 665MB of
    # workflows and execution history. Same trap that was pinned for prometheus,
    # loki, promtail and grafana on 2026-09-25/27.
    # 2026-09-28: 1.73.1 -> 1.123.82 to fix CVE-2026-21858 ("Ni8mare", CVSS 10.0),
    # an UNAUTHENTICATED RCE via content-type confusion in webhook request
    # handling, affecting 1.65-1.120.4 with no workaround. This instance is
    # publicly reachable and serves a webhook workflow, so it was squarely in
    # scope. Fixed in 1.121.0.
    #
    # Then 1.123.82 -> 2.41.3 the same day, once the CVE was cleared and the
    # instance had been audited against the 2.0 breaking changes. Almost none
    # applied here: 1 workflow (webhook -> httpRequest -> xml -> code ->
    # respondToWebhook), 0 credentials so no OAuth callback change, no Start
    # node, no sub-workflows, no ExecuteCommand/LocalFileTrigger, no Python, no
    # Git node, no retired nodes, no .env file so no dotenv parsing change, and
    # no BINARY_DATA/RUNNERS/BLOCK_ENV/RESTRICT_FILE overrides so the new
    # defaults apply cleanly.
    #
    # The one real change for this instance is task runners on by default: the
    # Code node now executes isolated. Its code is plain $("Webhook").first()
    # syntax, and the webhook returning 200 after the upgrade exercises it.
    image: docker.n8n.io/n8nio/n8n:2.41.3
    user: 1000:1001
    restart: always
    networks:
      - caddy
      # Also on the internal sandbox network so n8n can reach sandbox-api by
      # name. The sandbox services are deliberately NOT on caddy: sandbox-runner-1
      # is a privileged DinD container and has no business being adjacent to the
      # reverse proxy or the other ~48 containers.
      - sandbox
      # searxng lives on its own network rather than `sandbox`: the privileged
      # DinD runner has no reason to reach the search service, or vice versa.
      - search
    secrets: [N8N_ENCRYPTION_KEY]
    # Supplies N8N_SANDBOX_SERVICE_API_KEY. sandbox-api reads the same file as
    # SANDBOX_API_KEYS, so the two match by construction.
    env_file: ./secrets/sandbox.env
    environment:
      - N8N_HOST=n8n.ullrich.is
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENCRYPTION_KEY={{DOCKER-SECRET:N8N_ENCRYPTION_KEY}}
      - NODE_ENV=production
      # 2026-09-29: renamed from WEBHOOK_URL, which n8n 2.x deprecates. The new
      # name sets the base URL for both test and production webhooks.
      - N8N_WEBHOOK_URL=https://n8n.ullrich.is/
      
      # The four below are deprecation warnings of the form "this default will
      # change in a future version". Pinning them explicitly is the same problem
      # as pinning an image tag: without it, an upgrade silently changes behaviour.
      # Each is set to the NEW default rather than the current one, because the
      # evidence says the new value is both sufficient and safer here.
      #
      # 0 community packages are installed (installed_packages and installed_nodes
      # are both empty), so allowing unverified ones buys nothing and costs a
      # supply-chain hole on a publicly reachable instance.
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      # 32 recorded executions, longest 4.9s. 60s is ample; the old 300s only
      # delays noticing a wedged task.
      - N8N_RUNNERS_TASK_TIMEOUT=60
      # No workflow here uses a compression node, so these are pure zip-bomb
      # guards. 256MiB and 1000 entries are the incoming defaults.
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=268435456
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      - GENERIC_TIMEZONE=Europe/Berlin
    # n8n Assistant sandbox. The LLM (OpenRouter) key is set in the UI, not here.
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      # Web search for the Assistant. The alternative is a Brave API key
      # (INSTANCE_AI_BRAVE_SEARCH_API_KEY); self-hosting searxng keeps the
      # assistant's queries off a third party and costs nothing per query.
      - N8N_INSTANCE_AI_SEARXNG_URL=http://searxng:8080
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./with-expanded-env.sh:/with-expanded-env.sh
    entrypoint: ["/with-expanded-env.sh", "tini", "--", "/docker-entrypoint.sh"]
    labels:
      caddy_0: n8n.ullrich.is
      caddy_0.reverse_proxy: "{{upstreams 5678}}"
      caddy_0.redir_0: /legal/terms https://n8n.io/legal/#terms
      caddy_0.redir_1: /legal/privacy https://n8n.io/legal/#privacy
      flame.type: application
      flame.name: n8n
      flame.url: https://n8n.ullrich.is


  # ---------------------------------------------------------------------------
  # n8n Assistant sandbox (self-hosted "n8n-sandbox" provider).
  #
  # Three services from one release; the images are only supported together, so
  # N8N_SANDBOX_VERSION pins all three. Adapted from n8n's get-n8n-compose.yml:
  #   - no env_file: .env      -> the shared key comes from ./secrets/sandbox.env
  #   - no published ports     -> nothing here is internet-facing
  #   - own internal network   -> not reachable from caddy or other services
  #
  # sandbox-runner-1 is PRIVILEGED Docker-in-Docker and executes code the
  # assistant generates. It is the reason this stack is isolated on its own
  # network. It also accumulates images and build cache the same way the Forgejo
  # runner does, which is why sandbox-prune.timer exists.
  # ---------------------------------------------------------------------------

  # One-shot: mints the mutual-TLS material into the shared sandbox-tls volume.
  # Certificates are issued for the SANs "sandbox-api" and "sandbox-runner-<n>",
  # so those service names are load-bearing and must not be renamed.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.5.0
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls
    networks:
      - sandbox

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.5.0
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    # SANDBOX_API_KEYS lives here; n8n reads the same file for its own name.
    env_file: ./secrets/sandbox.env
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - sandbox

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.5.0
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    env_file: ./secrets/sandbox.env
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      # Default is 1000 concurrent sandboxes. This host is spinning disks with
      # ~150-250 combined random IOPS; a handful of concurrent DinD sandboxes is
      # already more than it can serve. Capped deliberately.
      SANDBOX_RUNNER_CAPACITY_TOTAL: '2'
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.5.0
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
      # The image declares an ANONYMOUS volume for /var/lib/docker. Naming it
      # keeps the inner daemon's images and layers in a volume we can find,
      # measure and prune, instead of a 64-hex name that leaks on recreate.
      - sandbox-runner-1-docker:/var/lib/docker
    networks:
      - sandbox


  # ---------------------------------------------------------------------------
  # SearXNG: the Assistant's web search backend (N8N_INSTANCE_AI_SEARXNG_URL).
  # Internal only -- no published port, no caddy label. n8n reaches it by name.
  # Pinned: SearXNG publishes a new dated tag most days and has no stable
  # release line, so `latest` would drift under us like the n8n tag did.
  # ---------------------------------------------------------------------------
  searxng:
    image: docker.io/searxng/searxng:2026.9.25-12f8b6515
    restart: unless-stopped
    # Supplies SEARXNG_SECRET, which overrides server.secret_key in settings.yml.
    env_file: ./secrets/searxng.env
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_PORT=8080
      # The entrypoint chowns the config dir when running as root; ours is a
      # read-only mount, so tell it not to try.
      - FORCE_OWNERSHIP=false
    volumes:
      # Read-only: the entrypoint only writes settings.yml when none exists,
      # and ours does.
      - ./searxng:/etc/searxng:ro
      - searxng-data:/var/cache/searxng
    networks:
      - search
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # mutual-TLS material shared between the three sandbox services
  sandbox-tls:
  sandbox-runner-1-docker:
  searxng-data:
  n8n_storage:

networks:
  # Internal only: no external: true, no published ports. Keeps the privileged
  # DinD runner away from caddy and every other service on the box.
  sandbox:
    internal: false   # runner must pull its sandbox image from ghcr.io
  # searxng needs egress to reach the upstream search engines, so this is
  # not `internal: true` either; it just keeps searxng off the sandbox net.
  search:
  caddy:
    external: true

secrets:
  N8N_ENCRYPTION_KEY:
    file: ./secrets/N8N_ENCRYPTION_KEY