# Moved out of the gitignored testing/ on 2026-10-12. It notified by mail,
# which nobody read; it now pushes to ntfy's zebra topic like the host alerts.
#
# Two providers:
# - docker: reports a new *digest* for the tag each container runs (re-pushed
#   tags, patches inside floating tags like forgejo:16).
# - file (watch/releases.yml): the release feed -- reports new tags. One list
#   instead of diun.* labels on every container, so editing it restarts nothing.
services:
  docker-socket-proxy:
    # PINNED 2026-10-11 to the running build (v0.5.0, same image as :latest).
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # No outgoing TLS (HAProxy in front of the docker socket, internal network
    # only); the CA mount is defence in depth, same as the other socket proxies.
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store.
      # Patched shared bundle (Alpine 20261020-r0); see core/ca-bundle/README.md.
      - ../../core/ca-bundle/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # /etc/ssl/certs also holds hash links (14bc7599.0 -> mozilla/emSign_ECC_Root_CA_-_G3.crt)
      # that Go/OpenSSL CApath readers would still load; blank the source file.
      - /dev/null:/usr/share/ca-certificates/mozilla/emSign_ECC_Root_CA_-_G3.crt:ro
    environment:
      CONTAINERS: 1
      EVENTS: 1
      IMAGES: 1

  diun:
    # PINNED 2026-10-11 to the running build.
    # image: crazymax/diun:4.33.0@sha256:e324b793eb32dfb7f74d3a39421ebf090141caaadee69b8f78da63112408ee25
    # STOPGAP eMudhra CA (2026-10-22): drop when upstream ships fixed CA store.
    # Dockerfile.cafix = the 4.33.0 digest above + Alpine ca-certificates 20261020-r0.
    build: {context: ., dockerfile: Dockerfile.cafix}
    image: diun-diun:cafix
    pull_policy: build
    restart: unless-stopped
    hostname: diun
    container_name: diun
    command: ["serve"]
    volumes:
      - "./volumes/data:/data"
      # A directory, not the file: a single-file bind mount pins the inode and
      # misses edits that replace the file.
      - "./watch:/etc/diun/watch:ro"
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
      LOG_JSON: "false"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: tcp://docker-socket-proxy:2375
      DIUN_WATCH_WORKERS: 20
      DIUN_WATCH_SCHEDULE: 0 */6 * * *
      DIUN_WATCH_JITTER: 30s
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_WATCH_FIRSTCHECKNOTIF: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_PROVIDERS_FILE_DIRECTORY: /etc/diun/watch
      # User `diun` in ntfy has write-only access to zebra and nothing else.
      DIUN_NOTIF_NTFY_ENDPOINT: http://ntfy:80
      DIUN_NOTIF_NTFY_TOPIC: zebra
      DIUN_NOTIF_NTFY_TOKENFILE: /run/secrets/DIUN_NOTIF_NTFY_TOKEN
      DIUN_NOTIF_NTFY_TAGS: whale
    secrets:
      - DIUN_NOTIF_NTFY_TOKEN
    networks:
      - internal
      - egress
      - ntfy

networks:
  internal:
    internal: true
  egress: {}
  ntfy:
    external: true

secrets:
  DIUN_NOTIF_NTFY_TOKEN:
    file: ./secrets/DIUN_NOTIF_NTFY_TOKEN
