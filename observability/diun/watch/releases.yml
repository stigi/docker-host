- {name: "codeberg.org/forgejo/forgejo:16", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^\d+$']}
- {name: "data.forgejo.org/forgejo/runner:13", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^\d+$']}
# semver sorting cannot parse "29-dind", so no max_tags here: every NN-dind tag is checked.
- {name: "docker:29-dind", watch_repo: true, notify_on: [new], include_tags: ['^\d+-dind$']}
- {name: "calcom/cal.com:v6.2.0", watch_repo: true, sort_tags: semver, max_tags: 3, notify_on: [new], include_tags: ['^v\d+\.\d+\.\d+$']}
