services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    extra_hosts:
      # Needed to scrape nftables-exporter, which runs on host network
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - internal
      - prometheus
      - caddy
    labels:
      caddy: prometheus.ullrich.is
      caddy.reverse_proxy: "{{upstreams 9090}}"
      caddy.import: secure *
      caddy_1: :2018
      caddy_1.metrics:
      flame.type: application
      flame.name: Prometheus
      flame.url: https://prometheus.ullrich.is

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave
    networks:
      - internal
    command: 
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
  
  # Replaced madron/iptables-exporter (2021, legacy ip_tables) with
  # cacack/nftables-exporter (reads via `nft`) during 22.04 → 24.04 upgrade.
  # Runs on host network + as root because nftables requires access to the
  # host's netfilter tables via netlink in the host network namespace.
  # Metric names changed: iptables_* → nftables_* (nftables_chain_rules,
  # nftables_rule_bytes, nftables_rule_packets, nftables_table_chains).
  nftables-exporter:
    image: cacack/nftables-exporter
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./nftables_exporter.yaml:/etc/nftables_exporter.yaml:ro

volumes:
  prometheus-data:

networks:
  caddy:
    external: true
  internal:
    internal: true
  prometheus:
    external: true
